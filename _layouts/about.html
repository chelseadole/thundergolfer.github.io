---
layout: default
---
<div>
  <picture class="headshot-picture">
    <!-- circle asset for small viewports, rectangle otherwise -->
    <source media="(max-width: 32em)"
            srcset="/images/headshot-circle.png">
    <img
      class="headshot"
      src="{{ page.headshot }}"
      alt="Profile picture"
    >
  </picture>
</div>
<div class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
  </header>
  <article class="post-content">
  {{ content }}
  </article>
</div>
